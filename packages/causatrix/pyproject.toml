[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veyltrace-causatrix"
version = "0.1.0"
description = "Veyltrace engine 7 (Causatrix): rankers, fusion and the hypothesis slate."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["veyltrace-core", "veyltrace-contracts"]

# Engine entry point (AGENTS §5): the pipeline resolves engines by this name, never by import path.
[project.entry-points."veyltrace.engines"]
causatrix = "veyltrace_causatrix.api:run"

# Rankers (07 §3.2): one module per ranker, resolved by name in the engine (ranking.load_ranker).
[project.entry-points."veyltrace.rankers"]
baro_rs = "veyltrace_causatrix.rankers.baro_rs:RANKER"
change_prox = "veyltrace_causatrix.rankers.change_prox:RANKER"
cp_sbfl = "veyltrace_causatrix.rankers.cp_sbfl:RANKER"
nsigma = "veyltrace_causatrix.rankers.nsigma:RANKER"
prism_m = "veyltrace_causatrix.rankers.prism_m:RANKER"

[tool.uv.sources]
veyltrace-core = { workspace = true }
veyltrace-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/veyltrace_causatrix"]

# Extra third-party or engine imports this package may use, checked by tests/test_isolation.py
# (M0 lead decision 2026-11-06). The lead's global deny-list always wins; the owning lane fills it.
[tool.veyltrace.isolation]
allow = []
