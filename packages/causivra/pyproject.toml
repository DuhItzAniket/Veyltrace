[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veyltrace-causivra"
version = "1.0.0"
description = "Veyltrace engine 10 (Causivra): incident card, receipt and replay."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# veyltrace-llm: the model client for card narration (10 §3.2); only relentra, causivra and gateway may use it.
dependencies = ["veyltrace-core", "veyltrace-contracts", "veyltrace-llm"]

# Engine entry point (AGENTS §5): the pipeline resolves engines by this name, never by import path.
[project.entry-points."veyltrace.engines"]
causivra = "veyltrace_causivra.api:run"

# `veyltrace replay` and the gateway's replay route delegate here (10 §3.9; core CLI, veyltrace.commands).
[project.entry-points."veyltrace.commands"]
replay = "veyltrace_causivra.replay:main"

[tool.uv.sources]
veyltrace-core = { workspace = true }
veyltrace-contracts = { workspace = true }
veyltrace-llm = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/veyltrace_causivra"]

# Extra third-party or engine imports this package may use, checked by tests/test_isolation.py
# (M0 lead decision 2026-11-06). The lead's global deny-list always wins; the owning lane fills it.
[tool.veyltrace.isolation]
allow = []
