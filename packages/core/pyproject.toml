[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veyltrace-core"
version = "0.1.0"
description = "Veyltrace core: hashing, IDs, rng, config, contract I/O, run context, pipeline and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Allowed runtime deps per packages/core/AGENTS.md (pydantic and referencing come with the generated
# models and jsonschema; core declares them because it imports them directly). Minimums only; uv.lock pins.
dependencies = [
    "veyltrace-contracts",
    "duckdb>=1.1",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "referencing>=0.35",
    "typer>=0.12",
]

[project.scripts]
veyltrace = "veyltrace_core.cli:app"

# Core owns the synthetic dataset (02 §6.1; R-03): adapter for dataset `synth` and its fetcher,
# which writes the evaluation-only answer keys (the telemetry is generated on demand, never cached).
[project.entry-points."veyltrace.adapters"]
synth = "veyltrace_core.synth.adapter:SynthAdapter"

[project.entry-points."veyltrace.fetchers"]
synth = "veyltrace_core.synth.fetch:fetch"

[tool.uv.sources]
veyltrace-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/veyltrace_core"]

# Extra third-party imports core may use beyond the global rules, checked by tests/test_isolation.py
# (M0 lead decision 2026-11-06). The lead's global deny-list always wins.
[tool.veyltrace.isolation]
allow = []
