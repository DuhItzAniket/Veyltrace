[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veyltrace-gateway"
version = "0.1.0"
description = "Veyltrace gateway: local HTTP API and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# FastAPI + uvicorn: the HTTP API and its ASGI server (02 §8 API row; 06 §2); pydantic: the
# gateway-only envelopes, imported directly (06 §3.1); pyarrow: the live buffer's record batches
# and the snapshot window (06 §3.4, X-10). veyltrace-infralume: its OTLP converter
# veyltrace_infralume.otlp, which the live receiver calls (06 §3.3; 01 §3.9 "used by ... the
# gateway's live buffer"; O-07, #24). Minimums only; uv.lock pins.
dependencies = [
    "veyltrace-core",
    "veyltrace-contracts",
    "veyltrace-infralume",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.9",
    "pyarrow>=17",
]

[tool.uv.sources]
veyltrace-core = { workspace = true }
veyltrace-contracts = { workspace = true }
veyltrace-infralume = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/veyltrace_gateway"]

# Extra third-party or engine imports this package may use, checked by tests/test_isolation.py
# (M0 lead decision 2026-11-06). The lead's global deny-list always wins; the owning lane fills it.
[tool.veyltrace.isolation]
# fastapi: the HTTP API routes in app.py (02 §8 API row; 06 §2).
# uvicorn: the ASGI server that __main__.py binds to loopback (06 §2).
# pydantic: the gateway-only envelopes in api_models.py (06 §3.1). starlette: FastAPI's base
# HTTPException, which the router raises for unknown routes; FastAPI documents registering the
# error handler on it (errors.py), and run_in_threadpool, which keeps the OTLP converter off the
# event loop (otlp.py). It ships with fastapi, so it adds no dependency.
# pyarrow: the live buffer's canonical tables (buffer.py; 06 §3.4).
# veyltrace_infralume.otlp: Infralume's OTLP converter, imported by name at start-up so the gateway
# runs (receiver 503) while O-07 is not installed (__main__.py; 06 §3.3; 01 §3.9; #24). Only that
# module: the gateway never imports Infralume's adapters or fetcher.
allow = ["fastapi", "pyarrow", "pydantic", "starlette", "uvicorn", "veyltrace_infralume.otlp"]
