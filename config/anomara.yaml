# config/anomara.yaml: section "anomara" (file stem). Owner: Observe lane.
# Spec: docs/engines/03-anomara.md §4. Keys arrive with the detectors that read them (O-04c: grid;
# O-04d: robust_z; O-04e: nsigma, silence; O-04f: bocpd; O-04g: onset, t_onset; detect_alert:
# slo). Overrides must name keys present here (packages/core/README.md: unknown keys are an error).

duckdb:
  # Read by veyltrace_core.duck.connect (M0 lead decision 2026-11-06). 03-anomara states no
  # values, so these are that decision's defaults (a priori).
  threads: 1
  memory_limit: "2GB"

grid:
  # Step g of bucketed series (traces, logs): Signalyth's epoch-aligned bucket (03-anomara §3.1;
  # 02-signalyth §3.1 buckets.traces_s = buckets.logs_s = 10 s). Also the step of a metric series
  # with fewer than two points, whose step cannot be inferred from t_ns (03 §3.1).
  bucket_s: 10

robust_z:
  # 03-anomara §3.2: s_B = max(mad_factor * MAD, IQR / iqr_divisor, epsilon(family, unit), eta * |median|).
  mad_factor: 1.4826        # normal consistency constant
  iqr_divisor: 1.349        # normal consistency constant
  eta: 0.02                 # a priori, 2% of |median|
  # epsilon(family, unit), a priori (03-anomara §3.2 table). "*" = any unit not listed for the
  # family; a (family, unit) pair with neither falls back to other."*", which only prevents a
  # division by zero.
  epsilon:
    cpu: {cores: 0.001, "*": 0.1}       # 0.1% CPU; RCAEval CPU looks like percent (unverified)
    mem: {bytes: 1048576}               # 1 MiB
    disk: {"*": 1.0}                    # source unit
    net: {"*": 1.0}                     # source unit
    latency: {ms: 1.0}                  # 1 ms
    self_time: {ms: 1.0}                # 1 ms
    errors: {ratio: 0.01, "*": 0.1}
    traffic: {"1/s": 0.1, "*": 1.0}
    logs: {"1/s": 0.1, count: 1.0}
    other: {"*": 1.0e-6}
  persist_steps: 3          # p, grid steps a deviation must persist (a priori)
  threshold: 3.0            # z; PRISM's nominal threshold (rcaeval_facts §Anomaly scoring methods)
  min_baseline_steps: 5     # grid buckets the baseline must cover, else score 0 (a priori)

nsigma:
  threshold: 3.0            # sigma; a priori (common 3-sigma rule)

silence:
  # 03-anomara §3.5: a run qualifies when it lasts at least L = max(min_gap_s, min_steps * g).
  min_gap_s: 60             # a priori
  min_steps: 3              # grid steps, a priori
  # Signals whose drop to exactly 0 is zero-silence (counts and resources); a priori.
  zero_signals: [rps, workload, log_rate, cpu, mem]
  max_baseline_zero_share: 0.2   # zero-silence needs a baseline at most 20% zero (a priori)
  min_baseline_coverage: 0.8     # absence-silence needs 80% of baseline buckets observed (a priori)
  service_metric_share: 0.5      # per_service.silent when half its metric series are silent (a priori)

bocpd:
  # 03-anomara §3.4: Adams & MacKay on the standardised grid series y = (x - median_B) / s_B.
  lambda: 100               # grid steps; hazard 1/lambda, a priori (one fault per case, ~96-150 steps)
  prior: {mu0: 0.0, kappa0: 1.0, alpha0: 1.0, beta0: 1.0}   # Normal-Gamma, a priori (unit-free data)
  r_max: 200                # run-length truncation, a priori (covers the longest case grid)
  short_run: 2              # m in cp_t = P(r_t <= m), a priori
  threshold: 0.5            # probability, a priori

onset:
  # 03-anomara §3.6: a BOCPD onset at most this far before the robust_z onset replaces it (a ramp's start).
  bocpd_max_lead_s: 120     # a priori

t_onset:
  # 03-anomara §3.7: t_onset is clamped to [t_alert + low, t_alert + high] (02 §6.3).
  clamp_s: [-60, 300]

slo:
  # detect_alert (03-anomara §3.8): the first sustained entry-service SLO breach (detected protocol).
  bucket_s: 10              # a priori, the same grid as Signalyth's traces
  min_spans: 5              # a priori, as signalyth traces.min_spans_per_quantile
  window_s: 300             # trailing baseline, a priori
  gap_s: 30                 # gap between the baseline and the judged bucket, a priori
  k: 3.0                    # one-sided z threshold, a priori
  persist_steps: 3          # consecutive buckets that confirm a breach, a priori
  min_baseline_points: 10   # baseline buckets needed to judge a bucket, a priori
  # Metrics fallback without traces: the same case-insensitive name rules as Signalyth
  # (02-signalyth §3.2 rules 5 and 6, metrics.counter_name_patterns).
  latency_metric_pattern: "latency|duration|response_time"
  error_metric_pattern: "^error$|error|fail|5xx"
  counter_name_patterns: ["_total$", "_count$", "_sum$", "_bucket$"]
