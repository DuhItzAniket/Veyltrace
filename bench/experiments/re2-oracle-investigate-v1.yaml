# Pre-registered (04 §1): RE2 × oracle, veyltrace:investigate (04 §6, M4; cut item 3 of 07 §1.1) on
# the 90-case subset of 04 §6 (one repetition per cluster, bench/re2_investigate_cases.yaml), 3
# seeds, paired with veyltrace:off on the same cases. Exploratory (04 §2 RQ2): investigate vs off
# here; investigate vs brief pairs with re2-oracle-rq2-v1's rows of the same case ids and seeds.
# Omitted defaults: veyltrace_bench/experiment.py. Frozen at prereg-v1; changes only via 04 §12.
experiment_id: re2-oracle-investigate-v1
description: "RQ2 (exploratory): veyltrace:investigate vs veyltrace:off on the RE2 subset, oracle alert"
prereg: true
rq: [RQ2]
dataset: {parts: [re2-ob, re2-ss, re2-tt], cases: bench/re2_investigate_cases.yaml, exclude: bench/dev_cases.yaml, normal_windows: none}
split: {family: null, scheme: none}
protocol: {alert: oracle, shift_s: 0, sources_drop: [], decoys: null,
           anonymize_services: false, inject_proposals: null, permute_proposals: null}
methods:
  - {id: "veyltrace:off", kind: veyltrace, ai: {mode: "off"}, overrides: {}}
  - id: "veyltrace:investigate"
    kind: veyltrace
    ai: {mode: record, relentra_mode: investigate, model: qwen3.5-9b-q4_k_m, seeds: [1, 2, 3]}
calibration: {fit: false}
metrics: [ac_at_k, avg_at_5, mrr, fine_ac_at_k, retrieval_at_k, rerank_at_1, chance, lift, cost]
statistics: {primary_metric: ac_at_1, per: system, noninferiority: null, holm_family: null,
             bootstrap: {resamples: 2000, seed: 1}, permutation: {n: 10000, seed: 2}, mcnemar: true}
resources: {workers: 1, timeout_s: 600}
