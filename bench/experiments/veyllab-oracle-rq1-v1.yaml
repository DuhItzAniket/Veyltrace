# Pre-registered (04 §1): VeylLab × oracle incl. no-fault, 04 §6 M4: baselines, Causatrix rankers
# alone + rrf and veyltrace:off.
# Lab data (05): real deploy/config/flag events and ≈ 10% no-fault captures, which are the normal
# windows of 04 §5.4 (normal_windows: veyllab); conformal and NO_FAULT files are cross-fitted on the
# 04 §5.4 folds of family veyllab (calibration fold ≠ test fold). RQ1 change-aware accuracy, RQ3
# coverage and NO_FAULT rates, estimation with CIs. veyllab-otel needs the OTel Demo profile (cut
# item 5 of 07 §1.1).
# Omitted defaults: veyltrace_bench/experiment.py. Frozen at prereg-v1; changes only via 04 §12.
experiment_id: veyllab-oracle-rq1-v1
description: "RQ1/RQ3: VeylLab incl. no-fault, baselines, rankers alone + rrf and veyltrace:off, oracle alert"
prereg: true
rq: [RQ1, RQ3, RQ4]
dataset: {parts: [veyllab-ob, veyllab-otel], cases: all, exclude: bench/dev_cases.yaml, normal_windows: veyllab}
split: {family: veyllab, scheme: crossfit2, cluster: [system, service, fault], stratify: [system, fault],
        seed: 20261108}
protocol: {alert: oracle, shift_s: 0, sources_drop: [], decoys: null,
           anonymize_services: false, inject_proposals: null, permute_proposals: null}
methods:
  - {id: "veyltrace:off", kind: veyltrace, ai: {mode: "off"}, overrides: {}}
  - {id: "causatrix:rrf", kind: causatrix}
  - {id: "causatrix:baro_rs", kind: causatrix, overrides: {causatrix.rankers.enabled: [baro_rs]}}
  - {id: "causatrix:change_prox", kind: causatrix, overrides: {causatrix.rankers.enabled: [change_prox]}}
  - {id: "causatrix:cp_sbfl", kind: causatrix, overrides: {causatrix.rankers.enabled: [cp_sbfl]}}
  - {id: "causatrix:graph_walk", kind: causatrix, overrides: {causatrix.rankers.enabled: [graph_walk]}}
  - {id: "causatrix:nsigma", kind: causatrix, overrides: {causatrix.rankers.enabled: [nsigma]}}
  - {id: "causatrix:prism_m", kind: causatrix, overrides: {causatrix.rankers.enabled: [prism_m]}}
  - {id: "rcaeval:baro", kind: rcaeval, rcaeval: {method: baro, length: 20}}
  - {id: "rcaeval:nsigma", kind: rcaeval, rcaeval: {method: nsigma, length: 20}}
  - {id: "simplerca", kind: internal_baseline}
calibration: {fit: true, alpha: 0.10, no_fault_beta: 0.10}
metrics: [ac_at_k, avg_at_5, mrr, fine_ac_at_k, retrieval_at_k, rerank_at_1, chance, lift, coverage, set_size, risk_coverage, no_fault_rates, cost]
statistics: {primary_metric: ac_at_1, per: system, noninferiority: null, holm_family: null,
             bootstrap: {resamples: 2000, seed: 1}, permutation: {n: 10000, seed: 2}, mcnemar: true}
resources: {workers: 1, timeout_s: 600}
