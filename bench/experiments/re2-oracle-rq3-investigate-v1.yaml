# Pre-registered (04 §1): RE2 × calibration (cross-fit) and normal windows for veyltrace:investigate
# (04 §6, M4), on the 90-case subset (bench/re2_investigate_cases.yaml) with its own fitted files
# (04 §5.4 item 4). RQ3 estimation as re2-oracle-rq3-v1.
# Omitted defaults: veyltrace_bench/experiment.py. Frozen at prereg-v1; changes only via 04 §12.
experiment_id: re2-oracle-rq3-investigate-v1
description: "RQ3: calibration of veyltrace:investigate on the RE2 subset, cross-fit folds"
prereg: true
rq: [RQ3]
dataset: {parts: [re2-ob, re2-ss, re2-tt], cases: bench/re2_investigate_cases.yaml, exclude: bench/dev_cases.yaml, normal_windows: rcaeval_pre_injection}
split: {family: rcaeval-re2, scheme: crossfit2, cluster: [system, service, fault], stratify: [system, fault],
        seed: 20261108}
protocol: {alert: oracle, shift_s: 0, sources_drop: [], decoys: null,
           anonymize_services: false, inject_proposals: null, permute_proposals: null}
methods:
  - id: "veyltrace:investigate"
    kind: veyltrace
    ai: {mode: record, relentra_mode: investigate, model: qwen3.5-9b-q4_k_m, seeds: [1, 2, 3]}
calibration: {fit: true, alpha: 0.10, no_fault_beta: 0.10}
metrics: [ac_at_k, retrieval_at_k, coverage, set_size, risk_coverage, no_fault_rates]
statistics: {primary_metric: ac_at_1, per: system, noninferiority: null, holm_family: null,
             bootstrap: {resamples: 2000, seed: 1}, permutation: {n: 10000, seed: 2}, mcnemar: true}
resources: {workers: 1, timeout_s: 600}
