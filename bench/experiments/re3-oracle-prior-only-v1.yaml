# Pre-registered (04 §1; frozen at tag prereg-v1): the prior-only floor of the RE3 accuracy tables
# (04 §4, §10 rule 3: prior-only on RE2 and RE3). As re2-oracle-prior-only-v1: each case is ranked
# by the root counts of the cross-fit fold that excludes its cluster (04 §5.4; RE3 is not a uniform
# grid, F5 only in OB, so strata are uneven), reads no telemetry, serves every alert protocol.
# Omitted fields take the defaults cited in veyltrace_bench/experiment.py. Changes only via 04 §12.
experiment_id: re3-oracle-prior-only-v1
description: "Floor: prior-only on RE3, cross-fit folds of 04 §5.4, oracle alert"
prereg: true
rq: [RQ1]
dataset:
  parts: [re3-ob, re3-ss, re3-tt]
  cases: all
  exclude: bench/dev_cases.yaml
  normal_windows: none
split:
  family: rcaeval-re3
  scheme: crossfit2               # 04 §5.4 items 1-3
  cluster: [system, service, fault]
  stratify: [system, fault]
  seed: 20261108
protocol:
  alert: oracle
  shift_s: 0
  sources_drop: []
methods:
  - {id: "prior-only", kind: internal_baseline}
calibration: {fit: false}
metrics: [ac_at_k, avg_at_5, mrr, chance, lift, cost]
resources: {workers: 1, timeout_s: 600}
