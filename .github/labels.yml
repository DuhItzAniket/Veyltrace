# Repository labels. Source of truth for scripts/sync_labels.py.
# Apply:   uv run scripts/sync_labels.py --apply      (lead, task L-00; re-run after editing this file)
# Preview: uv run scripts/sync_labels.py              (dry run, the default)
# Every PR carries one lane:*, one type:* and one agent:* label (docs/08-collaboration-and-git.md §4).

# --- Lanes (who owns the change; see .github/lanes.yml) ---
- name: "lane:reason"
  color: "1d76db"
  description: "Reason lane (lead): core, contracts, FaultLoom, Causatrix, Causentra, bench, CI"
- name: "lane:observe"
  color: "0e8a16"
  description: "Observe lane: Infralume, Signalyth, Anomara, Causync, Causalith, bench/decoys, bench/stats"
- name: "lane:explain"
  color: "5319e7"
  description: "Explain lane: Relentra, Causivra, llm, gateway, console, lab"

# --- Types (what kind of work; maps to the towncrier fragment type) ---
- name: "type:feat"
  color: "84b6eb"
  description: "New capability (fragment: feat)"
- name: "type:fix"
  color: "f9d0c4"
  description: "PR that fixes a bug (fragment: fix)"
- name: "type:bug"
  color: "d73a4a"
  description: "Issue reporting a defect"
- name: "type:chore"
  color: "cfd3d7"
  description: "Tooling, CI, dependencies, repo setup (fragment: chore)"
- name: "type:exp"
  color: "c2e0c6"
  description: "Experiment or benchmark run from a committed config (fragment: exp)"
- name: "type:paper"
  color: "fef2c0"
  description: "Research paper text, tables or figures (fragment: doc)"
- name: "type:adr"
  color: "bfdadc"
  description: "Architecture decision record (fragment: doc)"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only (fragment: doc)"
- name: "type:question"
  color: "d876e3"
  description: "Question or ambiguity in the docs; answered by the owner"

# --- Agent that produced most of the PR (for the paper's methods / threats section) ---
- name: "agent:claude"
  color: "d4a373"
  description: "Mostly written with Claude Code"
- name: "agent:codex"
  color: "a3c4bc"
  description: "Mostly written with OpenAI Codex (CLI, IDE or cloud)"
- name: "agent:opencode"
  color: "b8b8b8"
  description: "Mostly written with OpenCode"
- name: "agent:antigravity"
  color: "a0c4ff"
  description: "Mostly written with Google Antigravity (IDE or CLI)"
- name: "agent:cursor"
  color: "c9c9c9"
  description: "Mostly written with Cursor"
- name: "agent:copilot"
  color: "bdb2ff"
  description: "Mostly written with GitHub Copilot (VS Code agent or cloud agent)"
- name: "agent:windsurf"
  color: "9bf6ff"
  description: "Mostly written with Windsurf / Devin Desktop"
- name: "agent:none"
  color: "ededed"
  description: "Written without an AI coding agent"

# --- Priority ---
- name: "priority:P0"
  color: "b60205"
  description: "Blocks a milestone or breaks main; drop other work"
- name: "priority:P1"
  color: "d93f0b"
  description: "Needed for the current milestone"
- name: "priority:P2"
  color: "fbca04"
  description: "Nice to have; first to cut"

# --- Flow and guards ---
- name: "cross-lane"
  color: "e99695"
  description: "Touches another lane's paths; lead-approved; that lane's owner must review"
- name: "blocked"
  color: "000000"
  description: "Waiting on another issue; link it in the body"
- name: "frozen-contract"
  color: "0052cc"
  description: "Changes or requests a change to a frozen contract (CCR + ADR required)"
- name: "good-first-task"
  color: "7057ff"
  description: "Small, well-specified, good for warming up an agent on the repo"
- name: "risk"
  color: "e4e669"
  description: "A risk from docs/12-risks.md has fired; link the RK-NN id"
- name: "post-v1"
  color: "c5def5"
  description: "Idea outside the roadmap in docs/07-roadmap.md; not worked before v1.0"
