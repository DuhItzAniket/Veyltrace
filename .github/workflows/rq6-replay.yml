# RQ6 Tier 1 replay in CI (04 §2 H6a / SC-6: "on a second laptop and in CI"; CCR #440;
# ADR docs/adr/20261122-ak-rq6-replay-results.md). Manual only, never on a PR or a push.
#
# It checks out `ref` (a commit holding the committed R-16 results and the recording site's
# bench/results/replay/recording/), downloads the run archive (the zip parts of a draft release, each checked against the SHA-256 in the release body) and runs
# `veyltrace bench replay --role ci --table`, which replays exactly the recording result's runs.
#
# The archive (a .tar.gz of <runs root>/bench-ai/) holds telemetry, which 04 §10.1 does not
# redistribute. The repository is public, so an Actions artifact would be readable by any signed-in
# user: the archive is a *draft* release asset, which only collaborators with push access see, and
# this job reads it with its own token. The draft is never published, and it is deleted once the
# paper's replay numbers are committed (ADR). The asset name carries no case or dataset names.
# Its size comes from `bench replay --dry-run`; a release asset holds at most 2 GB, and above that
# the lead decides on another transport (ADR decision point).
#
# The result (replay.csv and replay_summary.json, no telemetry) is uploaded as an artifact; the lead
# commits it to bench/results/replay/ci/. Untrusted values reach shell steps only through `env:`.

name: rq6-replay

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag holding bench/results (the R-16 results and replay/recording)"
        required: true
      release:
        description: "Tag of the draft release whose assets are the run archive"
        required: true
        default: "r16-bench-ai"
      experiment:
        description: "The recording result's source experiment (bench replay --experiment, #526)"
        required: true
        default: "re2-oracle-rq2-v1"

concurrency:
  group: rq6-replay
  cancel-in-progress: false

permissions:
  contents: read # the default; only the replay job below may list draft releases

env:
  UV_PYTHON: "3.12"
  CI_UV_VERSION: "0.13.0" # as ci.yml: the uv that wrote uv.lock

jobs:
  replay:
    name: replay (ci)
    runs-on: ubuntu-24.04 # as ci.yml: the pinned image of the golden fixtures
    timeout-minutes: 360 # the GitHub-hosted maximum; the second laptop took 3 h 08 min (#575)
    permissions:
      contents: write # listing draft releases needs push access; this job writes nothing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # bench replay compares the run code with each source's code.commit
          persist-credentials: false
      - name: Free disk space (the runs are about 10 GB raw, plus one 2 GB part at a time)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.CI_UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages
      - name: Download and extract the run archive (draft release, zip parts)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          # The parts of `r16-bench-ai`: each a complete zip of whole run directories under bench-ai/,
          # and the release body's table gives each part's SHA-256, checked before extraction.
          gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.RELEASE)' > "$RUNNER_TEMP/release.json"
          test "$(grep -c . "$RUNNER_TEMP/release.json")" = 1 || { echo "expected one draft release tagged $RELEASE" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/runs"
          python3 - "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/parts.tsv" <<'PY'
          import json, re, sys
          rel = json.load(open(sys.argv[1], encoding="utf-8"))
          digests = dict(re.findall(r"\| (veyltrace-r16-bench-ai-part\d{2}-of-\d{2}\.zip) \|[^`]*`([0-9a-f]{64})`", rel["body"]))
          parts = sorted(a for a in rel["assets"] if re.fullmatch(r"veyltrace-r16-bench-ai-part\d{2}-of-\d{2}\.zip", a["name"]))
          if not parts or {a["name"] for a in parts} != set(digests):
              sys.exit(f"assets {[a['name'] for a in parts]} do not match the digest table {sorted(digests)}")
          for a in parts:
              print(f"{a['id']}\t{a['name']}\t{digests[a['name']]}")
          PY
          while IFS=$'\t' read -r id name sha; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "$RUNNER_TEMP/part.zip"
            echo "$sha  $RUNNER_TEMP/part.zip" | sha256sum -c --quiet
            python3 - "$RUNNER_TEMP/part.zip" "$RUNNER_TEMP/runs" <<'PY'
          import sys, zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():  # no member outside bench-ai/ (as scripts/explain/rq6_replay.py)
                  p = PurePosixPath(n)
                  if p.is_absolute() or ".." in p.parts or p.parts[0] != "bench-ai":
                      sys.exit(f"refused member {n}")
              z.extractall(sys.argv[2])
          PY
            rm "$RUNNER_TEMP/part.zip"
            echo "extracted $name"
          done < "$RUNNER_TEMP/parts.tsv"
          test -d "$RUNNER_TEMP/runs/bench-ai"
          df -h "$RUNNER_TEMP"
      - name: Size (run count and bytes; the recording host's dry run gave 9678032013 bytes)
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: uv run veyltrace bench replay --role ci --runs-root "$RUNNER_TEMP/runs" --experiment "$EXPERIMENT" --dry-run
      - name: Replay (Tier 1)
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: uv run veyltrace bench replay --role ci --runs-root "$RUNNER_TEMP/runs" --experiment "$EXPERIMENT" --table
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rq6-replay-ci
          path: bench/results/replay/ci/
          if-no-files-found: error
