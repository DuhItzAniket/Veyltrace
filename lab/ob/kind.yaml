# One-node kind cluster for the `ob` profile (05 §3.1), node image pinned by digest (pins.yaml;
# kind v0.33.0's default). No extraMounts: the Collector spool stays
# inside the node container and is copied out with `docker cp` (ADR 20261109-cl-lab-ob-profile).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: veyllab
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080          # frontend NodePort
        hostPort: 8080
        listenAddress: "127.0.0.1"    # local only
