# Demo fault for the live demo and the X-10 rehearsal (docs/06-live-demo.md): F04 network delay,
# L1 (200 ms, 10% jitter), on currencyservice, 600 s (the plan's default fault window).
# It is exactly what `vlab.faults.injection()` builds for the x02-smoke entry
# {fault: F04, target: currencyservice, severity: L1}, named vl-demo-f04;
# lab/tests/test_demo_manifest.py keeps the two equal. F04 was validated on laptop 1 (05 §8.2,
# ADR 20261110-cl-lab-validation) and needs sch_netem, which loads there (docs/team/cl.md).
#   apply:  kubectl --context kind-veyllab apply -f lab/demo/f04-currencyservice-l1.yaml
#   revert: kubectl --context kind-veyllab -n veyllab-app delete networkchaos vl-demo-f04 --ignore-not-found
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: vl-demo-f04
  namespace: veyllab-app
spec:
  action: delay
  delay:
    correlation: '0'
    jitter: 20ms
    latency: 200ms
  direction: to
  duration: 600s
  mode: all
  selector:
    labelSelectors:
      app: currencyservice
    namespaces:
    - veyllab-app
